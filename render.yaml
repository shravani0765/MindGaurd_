services:
  - type: web
    name: mindguard-django-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r django_backend/requirements.txt
    startCommand: cd django_backend && python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_REQUIRE
        value: true
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: true
      - key: EMAIL_TIMEOUT
        value: 20
      # false so a failed send is logged and reported to the user instead of
      # silently leaving an account that can never be verified.
      - key: EMAIL_FAIL_SILENTLY
        value: false
      # Demo escape hatch; leave false unless SMTP is unavailable.
      - key: DEMO_AUTO_VERIFY
        value: false
      # Must be verified as a sender in Brevo.
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_TIMEOUT_SECONDS
        value: 12
