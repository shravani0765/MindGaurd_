# Render Blueprint — creates the database and the API together and wires them
# to each other, so almost nothing has to be typed into the dashboard.
#
#   Render -> New -> Blueprint -> select this repo -> Apply
#
# Only the Brevo credentials are left blank (marked `sync: false`); everything
# else is either a literal or generated by Render.

databases:
  - name: mindguard-db
    plan: free
    region: oregon
    # Django 4.2 is tested against PostgreSQL 12-16; 17/18 are newer than this
    # release line, so pin 16.
    postgresMajorVersion: "16"

services:
  - type: web
    name: mindguard-django-api
    runtime: python
    # Must match the database region, or the internal connection string will
    # not resolve.
    region: oregon
    plan: free
    buildCommand: pip install -r django_backend/requirements.txt
    startCommand: cd django_backend && python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: false

      # Generated once by Render and kept stable across deploys. Rotating it
      # invalidates every outstanding auth, verification, and reset token.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      # Injected straight from the database above — no copy/paste.
      - key: DATABASE_URL
        fromDatabase:
          name: mindguard-db
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: true

      # Host header Django will accept. Derived from this service's name.
      - key: ALLOWED_HOSTS
        value: mindguard-django-api.onrender.com

      # Used to build verification and password-reset links, so it must be the
      # domain users actually browse.
      - key: FRONTEND_URL
        value: https://mind-grad.vercel.app

      # Only needed for direct cross-origin calls. The Vercel rewrite in
      # vercel.json proxies /api server-side, so normal traffic is same-origin
      # and never triggers a preflight.
      - key: CORS_ALLOWED_ORIGINS
        value: https://mind-grad.vercel.app,https://mind-gaurd.vercel.app

      # --- Email (Brevo) ---------------------------------------------------
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USE_TLS
        value: true
      - key: EMAIL_TIMEOUT
        value: 20
      # false so a failed send is logged and reported instead of silently
      # leaving an account that can never be verified.
      - key: EMAIL_FAIL_SILENTLY
        value: false
      # Brevo dashboard -> SMTP & API -> SMTP. The "Login" value, shaped like
      # 9a1b2c001@smtp-brevo.com. NOT the Brevo account email.
      - key: EMAIL_HOST_USER
        sync: false
      # The xsmtpsib-... SMTP key from the same page.
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Must be verified as a sender in Brevo or messages are rejected.
      - key: DEFAULT_FROM_EMAIL
        sync: false

      # Set true in the dashboard to let accounts log in without email
      # verification. Demo only: it lets anyone register an address they do
      # not control.
      - key: DEMO_AUTO_VERIFY
        value: false

      # Optional. Without it, text analysis uses the heuristic path.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_TIMEOUT_SECONDS
        value: 12
